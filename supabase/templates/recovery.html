<!doctype html>
<html lang="tr">
  <body style="margin:0;padding:24px;background:#f6f6f9;font-family:Arial,Helvetica,sans-serif;color:#0e0e11;">
    <div style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:20px;padding:28px;">
      <h2 style="margin:0 0 12px;font-size:22px;">Şifreni sıfırla</h2>
      <p style="margin:0 0 20px;line-height:1.5;">Hesabın için şifre sıfırlama isteği aldık. Yeni şifre belirlemek için aşağıdaki düğmeye dokun.</p>
      <p style="margin:0 0 24px;">
        <a href="{{ .SiteURL }}/sifre-sifirla/yeni?token_hash={{ .TokenHash }}&amp;type=recovery"
           style="display:inline-block;background:#0e0e11;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:600;">Yeni şifre belirle</a>
      </p>
      <p style="margin:0;font-size:13px;color:#5a5a66;line-height:1.5;">Bağlantı tek kullanımlıktır ve bir saat geçerlidir. Bu isteği sen yapmadıysan bu e-postayı yok sayabilirsin, şifren değişmez.</p>
    </div>
  </body>
